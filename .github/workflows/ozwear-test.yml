name: Test OZWear API

on:
  workflow_dispatch:

jobs:
  test-ozwear-api:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test OZWear API
        env:
          OZWEAR_API_KEY: ${{ secrets.OZWEAR_API_KEY }}
          OZWEAR_API_SECRET: ${{ secrets.OZWEAR_API_SECRET }}
          OZWEAR_VERIFY_SSL: "false"
        run: python ozwear_test.py

      - name: Save API results
        uses: actions/upload-artifact@v4
        with:
          name: ozwear-api-results
          path: |
            ozwear_products.json
            ozwear_stocks.json
            ozwear_inventory.csv
          if-no-files-found: error
          retention-days: 7
