name: Ozwear Inventory Sync
on:
  schedule:
    - cron: '0 1,13 * * *'
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
    - name: 저장소 코드 가져오기
      uses: actions/checkout@v4
    - name: 파이썬 환경 설정
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: 필수 라이브러리 설치
      run: |
        python -m pip install --upgrade pip
        pip install requests
    - name: 오즈웨어 재고 동기화 실행
      env:
        OZWEAR_API_KEY: ${{ secrets.OZWEAR_API_KEY }}
        OZWEAR_API_SECRET: ${{ secrets.OZWEAR_API_SECRET }}
        SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
        SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
        SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
      run: python sync_ozwear_inventory.py
